<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="300" viewBox="0 0 1180 300" role="img" aria-labelledby="t d">
  <title id="t">Prompt do devkit</title>
  <desc id="d">Exemplos do prompt: repositório com alterações, commitado sem push, em dia e erro no último comando.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .g { fill: #6b7280; } .b { fill: #60a5fa; font-weight: 700; } .r { fill: #f87171; } .gr { fill: #4ade80; }
    .y { fill: #facc15; } .c { fill: #22d3ee; } .m { fill: #c084fc; } .w { fill: #e5e7eb; }
  </style>
  <rect width="1180" height="300" rx="12" fill="#0b1020"/>
  <circle cx="24" cy="22" r="6" fill="#fb7185"/><circle cx="44" cy="22" r="6" fill="#fbbf24"/><circle cx="64" cy="22" r="6" fill="#4ade80"/>

  <text x="24" y="66"><tspan class="g">╭─ </tspan><tspan class="y">yuri </tspan><tspan class="b">~/projects/api</tspan><tspan class="r">   feat/login</tspan><tspan class="g"> 3f9c2a1</tspan><tspan class="r"> ✎3</tspan><tspan class="gr"> ●1</tspan><tspan class="r"> ?2</tspan><tspan class="c">  ⎈ kind-dev:api</tspan><tspan class="gr">  ⬢ 22.11.0</tspan><tspan class="g">  ¯\_(ツ)_/¯ 🐧</tspan></text>
  <text x="24" y="88"><tspan class="g">╰─ </tspan><tspan class="gr">❯ </tspan><tspan class="w">git commit -m "feat: login"</tspan><tspan class="g" x="1000">Mon, 10 Nov · 14:02</tspan></text>

  <text x="24" y="136"><tspan class="g">╭─ </tspan><tspan class="y">yuri </tspan><tspan class="b">~/projects/api</tspan><tspan class="gr">   feat/login</tspan><tspan class="gr"> ↑1</tspan><tspan class="g">   ← commitado, falta o push</tspan></text>
  <text x="24" y="158"><tspan class="g">╰─ </tspan><tspan class="gr">❯ </tspan><tspan class="w">npm test</tspan></text>

  <text x="24" y="206"><tspan class="g">╭─ </tspan><tspan class="r">root</tspan><tspan class="g">@</tspan><tspan class="m">bastion </tspan><tspan class="b">~/infra/prod</tspan><tspan class="c">   main</tspan><tspan class="gr"> ✔</tspan><tspan class="r">  ⎈ prod-eks:payments</tspan><tspan class="r">  ☁ prod(sa-east-1)</tspan><tspan class="r">  ⛅ tf:prod</tspan><tspan class="y">  took 1m12s</tspan></text>
  <text x="24" y="228"><tspan class="g">╰─ </tspan><tspan class="r">[✘ 1] ❯ </tspan><tspan class="w">terraform plan</tspan></text>

  <text x="24" y="276" class="g">vermelho = não commitado · verde = commitado sem push · amarelo = atrás · ciano = em dia</text>
</svg>
